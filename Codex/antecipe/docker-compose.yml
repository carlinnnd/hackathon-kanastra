version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: antecipe-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antecipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variavel POSTGRES_PASSWORD obrigatoria no ambiente}
      POSTGRES_DB: ${POSTGRES_DB:-antecipe_db}
    ports:
      # Bind apenas em loopback para maior segurança
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antecipe} -d ${POSTGRES_DB:-antecipe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antecipe-backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-antecipe}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-antecipe_db}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Variavel ADMIN_TOKEN obrigatoria no ambiente}
      DATA_BASE: "${DATA_BASE:-2026-10-22}"
      ENABLE_DEMO_CADASTRO: "${ENABLE_DEMO_CADASTRO:-true}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
